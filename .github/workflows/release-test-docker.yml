name: Release Test Docker
on:
  workflow_dispatch:
    inputs:
      addons:
        description: 'Add-ons to build and include, one per line: <clone-url> [branch] [gradle-project-path]. The project path is only needed for repos with many add-ons, e.g. :addOns:ascanrules'
        required: true
        default: 'https://github.com/zaproxy-addons/ptk.git'
        type: string

jobs:
  publish:
    name: Build and Push Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build add-ons
        env:
          ADDONS: ${{ inputs.addons }}
        run: |
          OUT="$RUNNER_TEMP/addons-override"
          mkdir -p "$OUT"
          i=0
          while read -r url branch project; do
            [ -z "$url" ] && continue
            i=$((i+1))
            dir="$RUNNER_TEMP/addon-src-$i"
            git clone --depth 1 ${branch:+--branch "$branch"} "$url" "$dir"
            (cd "$dir" && ./gradlew "${project}:copyZapAddOn" --into="$OUT")
          done <<< "$ADDONS"
          ls -l "$OUT"
          echo "ADDONS_DIR=$OUT" >> "$GITHUB_ENV"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile-live
          platforms: linux/amd64
          push: true
          provenance: false
          build-contexts: |
            addons=${{ env.ADDONS_DIR }}
          tags: |
            ghcr.io/zaproxy/zaproxy:test
          secrets: |
            webswing_url=${{ secrets.WEBSWING_URL }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/zaproxy/zaproxy
            index:org.opencontainers.image.description=Test Docker image with custom add-on builds.
            index:org.opencontainers.image.licenses=Apache-2.0
