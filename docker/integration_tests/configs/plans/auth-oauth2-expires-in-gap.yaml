--- # KNOWN GAP, TRACKED HERE ON PURPOSE: OAuth2AuthenticationMethod (zap-extensions authhelper
# add-on) never reads the OAuth2 "expires_in" field, so it never proactively refreshes a token
# ahead of its expiry. This plan requests a 2 second token lifetime from the dev add-on's mock
# OAuth2 server, waits 4 seconds (the mock server enforces that TTL server-side), then re-requests
# the protected resource with the now-stale, unrefreshed token.
#
# Current (undesirable, but real) behaviour: the second request below gets a 401 - the mock server
# rejects the now-expired access token, and ZAP has no way to have noticed and refreshed it first.
#
# TODO(oauth2-proactive-refresh): this test is deliberately pinned to today's behaviour
# (responseCode: 401 on the second request) so it runs clean in nightly CI rather than failing
# every night for a known reason. Once OAuth2AuthenticationMethod gains proactive expiry handling,
# update the second request's responseCode to 200 and remove this comment block. If this plan
# starts failing on its own (the real response becomes 200 while 401 is still asserted), that is
# this exact fix landing, not a regression - update the assertion, don't just silence the test.
# See also: zap-extensions addOns/authhelper/oauth2-dev-addon-plans/10-expires-in-gap.yaml, which
# documents and exercises the same gap for local/manual testing.
env:
  contexts:
  - name: "oauth2-expires-in-gap"
    urls:
    - "https://api.oauth2.zap"
    includePaths:
    - "https://api\\.oauth2\\.zap.*"
    excludePaths: []
    authentication:
      method: "oauth2"
      parameters:
        grantType: "client_credentials"
        tokenEndpoint: "https://authserver.oauth2.zap/token"
        clientId: "test-client"
        clientSecret: "test-secret"
        extraTokenParams:
          expires_in: "2"
      verification:
        method: "autodetect"
    sessionManagement:
      method: "headers"
      parameters:
        Authorization: "Bearer {%json:access_token%}"
    technology:
      exclude: []
    users:
    - name: "m2m client"
      credentials: {}
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: true
    progressToStdout: true
  vars: {}
jobs:
- parameters:
    maxAlertsPerRule: 0
    scanOnlyInScope: true
    maxBodySizeInBytesToScan: 0
    enableTags: false
    disableAllRules: true
  rules:
  - id: 10111
    name: "Authentication Request Identified"
    threshold: "medium"
  - id: 10112
    name: "Session Management Response Identified"
    threshold: "medium"
  - id: 10113
    name: "Verification Request Identified"
    threshold: "medium"
  name: "passiveScan-config"
  type: "passiveScan-config"
- parameters:
    user: "m2m client"
  requests:
  - url: "https://api.oauth2.zap/userinfo"
    name: ""
    method: ""
    httpVersion: ""
    headers: []
    data: ""
    responseCode: 200
  name: "requestor"
  type: "requestor"
  tests:
  - type: "stats"
    statistic: "stats.auth.success"
    site: "https://authserver.oauth2.zap"
    operator: ">="
    value: 1
    onFail: "error"
- parameters:
    time: "4"
  name: "delay"
  type: "delay"
- parameters:
    user: "m2m client"
  requests:
  - url: "https://api.oauth2.zap/userinfo"
    name: ""
    method: ""
    httpVersion: ""
    headers: []
    data: ""
    responseCode: 401
  name: "requestor-after-expiry"
  type: "requestor"
- parameters:
    action: "add"
    type: "standalone"
    engine: "ECMAScript : Graal.js"
    name: "af-diags.js"
    target: ""
    source: "../scripts/standalone/af-diags.js"
  name: "script"
  type: "script"
- parameters:
    action: "run"
    type: "standalone"
    name: "af-diags.js"
  name: "script"
  type: "script"
