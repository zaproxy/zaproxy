---
env:
  contexts:
  - name: "oauth2-password-grant"
    urls:
    - "https://api.oauth2.zap"
    includePaths:
    - "https://api\\.oauth2\\.zap.*"
    excludePaths: []
    authentication:
      method: "oauth2"
      parameters:
        grantType: "password"
        tokenEndpoint: "https://authserver.oauth2.zap/token"
        clientId: "test-client"
        clientSecret: "test-secret"
      verification:
        method: "autodetect"
    sessionManagement:
      method: "headers"
      parameters:
        Authorization: "Bearer {%json:access_token%}"
    technology:
      exclude: []
    users:
    - name: "test"
      credentials:
        username: "test@test.com"
        password: "password123"
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: true
    progressToStdout: true
  vars: {}
jobs:
- parameters:
    maxAlertsPerRule: 0
    scanOnlyInScope: true
    maxBodySizeInBytesToScan: 0
    enableTags: false
    disableAllRules: true
  rules:
  - id: 10111
    name: "Authentication Request Identified"
    threshold: "medium"
  - id: 10112
    name: "Session Management Response Identified"
    threshold: "medium"
  - id: 10113
    name: "Verification Request Identified"
    threshold: "medium"
  name: "passiveScan-config"
  type: "passiveScan-config"
- parameters:
    user: "test"
  requests:
  - url: "https://api.oauth2.zap/userinfo"
    name: ""
    method: ""
    httpVersion: ""
    headers: []
    data: ""
    responseCode: 200
  name: "requestor"
  type: "requestor"
  tests:
  - type: "stats"
    statistic: "stats.auth.success"
    site: "https://authserver.oauth2.zap"
    operator: ">="
    value: 1
    onFail: "error"
  - type: "stats"
    statistic: "stats.auth.state.loggedin"
    site: "https://authserver.oauth2.zap"
    operator: ">="
    value: 1
    onFail: "error"
- parameters:
    action: "add"
    type: "standalone"
    engine: "ECMAScript : Graal.js"
    name: "af-diags.js"
    target: ""
    source: "../scripts/standalone/af-diags.js"
  name: "script"
  type: "script"
- parameters:
    action: "run"
    type: "standalone"
    name: "af-diags.js"
  name: "script"
  type: "script"
